name: Build RoleForge campaign PDFs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip pdf-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PDF renderer
        run: |
          npm install
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Generate PDFs from current main source
        run: npm run pdf

      - name: Validate PDF contracts
        run: |
          test "$(pdfinfo docs/russell-dudek-jnj-resume.pdf | awk '/^Pages:/ {print $2}')" = '2'
          test "$(pdfinfo docs/russell-dudek-jnj-cover-letter.pdf | awk '/^Pages:/ {print $2}')" = '1'
          for f in docs/russell-dudek-jnj-interview-brief.pdf docs/russell-dudek-jnj-120-day-plan.pdf docs/russell-dudek-jnj-otc-exception-portfolio.pdf; do
            test -s "$f"
          done

      - name: Commit regenerated PDFs and audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs qa
          if git diff --cached --quiet; then
            echo 'PDFs already current'
          else
            git commit -m 'Regenerate aligned campaign PDFs [skip pdf-build]'
            git push origin main
          fi
